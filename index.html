<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PharmaStock Advisor</title>
  <!-- Inline SVG favicon (pill icon) — prevents 404 in browser console -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%232563eb' stroke-width='1.75' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M10.5 3.5a5 5 0 0 1 7.07 7.07L12 16.14 4.93 9.07a5 5 0 0 1 5.57-5.57Z'/%3E%3Cline x1='12' y1='10.5' x2='17.5' y2='16'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!--
    SVG SPRITE — all icons in one place.
    Icons: outline style, stroke-width 1.75, stroke-linecap/linejoin round.
    Rendered via: <svg class="icon"><use href="#icon-NAME"/></svg>
    aria-hidden="true" on every decorative use; icon-only buttons carry aria-label.
  -->
  <svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
    <!-- pill: logo -->
    <symbol id="icon-pill" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <path d="M10.5 3.5a5 5 0 0 1 7.07 7.07L12 16.14 4.93 9.07a5 5 0 0 1 5.57-5.57Z"/>
      <line x1="12" y1="10.5" x2="17.5" y2="16"/>
    </symbol>

    <!-- message-circle: Chat nav -->
    <symbol id="icon-message-circle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
    </symbol>

    <!-- package: Stok nav -->
    <symbol id="icon-package" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="21 8 21 21 3 21 3 8"/>
      <rect x="1" y="3" width="22" height="5"/>
      <line x1="10" y1="12" x2="14" y2="12"/>
    </symbol>

    <!-- file-text: Laporan nav / report title -->
    <symbol id="icon-file-text" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
      <polyline points="14 2 14 8 20 8"/>
      <line x1="16" y1="13" x2="8" y2="13"/>
      <line x1="16" y1="17" x2="8" y2="17"/>
      <polyline points="10 9 9 9 8 9"/>
    </symbol>

    <!-- clock: Hampir kedaluwarsa -->
    <symbol id="icon-clock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"/>
      <polyline points="12 6 12 12 16 14"/>
    </symbol>

    <!-- list-ordered: FEFO urutan -->
    <symbol id="icon-list-ordered" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <line x1="10" y1="6" x2="21" y2="6"/>
      <line x1="10" y1="12" x2="21" y2="12"/>
      <line x1="10" y1="18" x2="21" y2="18"/>
      <path d="M4 6h1v4"/>
      <path d="M4 10h2"/>
      <path d="M6 18H4c0-1 2-2 2-3s-1-1.5-2-1"/>
    </symbol>

    <!-- alert-triangle: Waspada / warning -->
    <symbol id="icon-alert-triangle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
      <line x1="12" y1="9" x2="12" y2="13"/>
      <line x1="12" y1="17" x2="12.01" y2="17"/>
    </symbol>

    <!-- alert-octagon: Kritis -->
    <symbol id="icon-alert-octagon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="7.86 2 16.14 2 22 7.86 22 16.14 16.14 22 7.86 22 2 16.14 2 7.86 7.86 2"/>
      <line x1="12" y1="8" x2="12" y2="12"/>
      <line x1="12" y1="16" x2="12.01" y2="16"/>
    </symbol>

    <!-- x-circle: Kedaluwarsa -->
    <symbol id="icon-x-circle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"/>
      <line x1="15" y1="9" x2="9" y2="15"/>
      <line x1="9" y1="9" x2="15" y2="15"/>
    </symbol>

    <!-- check-circle: Aman / success -->
    <symbol id="icon-check-circle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
      <polyline points="22 4 12 14.01 9 11.01"/>
    </symbol>

    <!-- wallet: Nilai stok -->
    <symbol id="icon-wallet" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 12V8H6a2 2 0 0 1 0-4h14v4"/>
      <path d="M4 6v12a2 2 0 0 0 2 2h14v-4"/>
      <circle cx="16" cy="12" r="2"/>
    </symbol>

    <!-- lightbulb: Rekomendasi -->
    <symbol id="icon-lightbulb" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <line x1="9" y1="18" x2="15" y2="18"/>
      <line x1="10" y1="22" x2="14" y2="22"/>
      <path d="M15.09 14c.18-.98.65-1.74 1.41-2.5A6.99 6.99 0 1 0 6.5 11.5c.76.76 1.23 1.52 1.41 2.5"/>
    </symbol>

    <!-- send: Send button -->
    <symbol id="icon-send" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <line x1="22" y1="2" x2="11" y2="13"/>
      <polygon points="22 2 15 22 11 13 2 9 22 2"/>
    </symbol>

    <!-- refresh-cw: Perbarui / retur -->
    <symbol id="icon-refresh-cw" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="23 4 23 10 17 10"/>
      <polyline points="1 20 1 14 7 14"/>
      <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
    </symbol>

    <!-- upload: Unggah CSV -->
    <symbol id="icon-upload" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="16 16 12 12 8 16"/>
      <line x1="12" y1="12" x2="12" y2="21"/>
      <path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3"/>
    </symbol>

    <!-- clipboard: Tempel CSV -->
    <symbol id="icon-clipboard" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/>
      <rect x="8" y="2" width="8" height="4" rx="1" ry="1"/>
    </symbol>

    <!-- bar-chart-2: Report section heading -->
    <symbol id="icon-bar-chart" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <line x1="18" y1="20" x2="18" y2="10"/>
      <line x1="12" y1="20" x2="12" y2="4"/>
      <line x1="6"  y1="20" x2="6"  y2="14"/>
    </symbol>

    <!-- ban: Hentikan penjualan (expired action) -->
    <symbol id="icon-ban" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"/>
      <line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/>
    </symbol>

    <!-- tag: Diskon penjualan -->
    <symbol id="icon-tag" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/>
      <line x1="7" y1="7" x2="7.01" y2="7"/>
    </symbol>

    <!-- eye: Pantau & promosikan -->
    <symbol id="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
      <circle cx="12" cy="12" r="3"/>
    </symbol>

    <!-- box: Normal/aman action -->
    <symbol id="icon-box" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
      <polyline points="3.27 6.96 12 12.01 20.73 6.96"/>
      <line x1="12" y1="22.08" x2="12" y2="12"/>
    </symbol>

    <!-- calendar: Laporan date -->
    <symbol id="icon-calendar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
      <line x1="16" y1="2" x2="16" y2="6"/>
      <line x1="8"  y1="2" x2="8"  y2="6"/>
      <line x1="3"  y1="10" x2="21" y2="10"/>
    </symbol>

    <!-- inbox: Empty state -->
    <symbol id="icon-inbox" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/>
      <path d="M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/>
    </symbol>

    <!-- bot: Agent avatar -->
    <symbol id="icon-bot" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="11" width="18" height="10" rx="2"/>
      <circle cx="12" cy="5" r="2"/>
      <path d="M12 7v4"/>
      <line x1="8"  y1="16" x2="8.01"  y2="16"/>
      <line x1="16" y1="16" x2="16.01" y2="16"/>
    </symbol>

    <!-- user: User avatar -->
    <symbol id="icon-user" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
      <circle cx="12" cy="7" r="4"/>
    </symbol>

    <!-- bell: Perhatian alert -->
    <symbol id="icon-bell" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
      <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
    </symbol>

    <!-- trending-down: Stock value in report card -->
    <symbol id="icon-trending-down" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="23 18 13.5 8.5 8.5 13.5 1 6"/>
      <polyline points="17 18 23 18 23 12"/>
    </symbol>

    <!-- layers: Total batch count card -->
    <symbol id="icon-layers" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="12 2 2 7 12 12 22 7 12 2"/>
      <polyline points="2 17 12 22 22 17"/>
      <polyline points="2 12 12 17 22 12"/>
    </symbol>

    <!-- check: Aman (minimal) for stat card -->
    <symbol id="icon-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="20 6 9 17 4 12"/>
    </symbol>

    <!-- message-x: Hapus percakapan -->
    <symbol id="icon-message-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
      <line x1="9" y1="10" x2="15" y2="10"/>
    </symbol>

    <!-- rotate-ccw: Reset data (restore defaults) -->
    <symbol id="icon-rotate-ccw" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="1 4 1 10 7 10"/>
      <path d="M3.51 15a9 9 0 1 0 .49-4.95L1 10"/>
    </symbol>
  </svg>

  <!-- ===== TOP NAVIGATION BAR ===== -->
  <header class="topbar">
    <div class="topbar-brand">
      <!-- Logo icon — decorative, title text provides the label -->
      <span class="topbar-icon" aria-hidden="true">
        <svg class="icon icon-lg" aria-hidden="true"><use href="#icon-pill"/></svg>
      </span>
      <span class="topbar-title">PharmaStock Advisor</span>
      <span class="topbar-sub">Asisten Stok Apotek Berbasis FEFO</span>
    </div>
    <nav class="topbar-nav" aria-label="Navigasi panel">
      <button class="nav-btn active" data-panel="chat">
        <svg class="icon" aria-hidden="true"><use href="#icon-message-circle"/></svg>
        Chat
      </button>
      <button class="nav-btn" data-panel="stock">
        <svg class="icon" aria-hidden="true"><use href="#icon-package"/></svg>
        Stok
      </button>
      <button class="nav-btn" data-panel="report">
        <svg class="icon" aria-hidden="true"><use href="#icon-file-text"/></svg>
        Laporan
      </button>
    </nav>
  </header>

  <!-- ===== MAIN CONTENT AREA ===== -->
  <main class="main-content">

    <!-- ==================== PANEL: CHAT ==================== -->
    <section id="panel-chat" class="panel active" aria-label="Panel Chat">
      <div class="chat-wrapper">

        <!-- Chat panel header: label + "Hapus percakapan" reset control -->
        <div class="chat-panel-header">
          <span class="chat-panel-title">
            <svg class="icon icon-sm" aria-hidden="true"><use href="#icon-message-circle"/></svg>
            Percakapan
          </span>
          <button class="btn-danger" id="clearChatBtn" aria-label="Hapus percakapan dan tampilkan salam ulang">
            <svg class="icon icon-sm" aria-hidden="true"><use href="#icon-message-x"/></svg>
            Hapus percakapan
          </button>
        </div>

        <!-- Chat message history -->
        <div class="chat-messages" id="chatMessages" role="log" aria-live="polite" aria-label="Riwayat percakapan">
          <!-- Messages injected by JS -->
        </div>

        <!-- Quick suggestion chips -->
        <div class="chat-suggestions" id="chatSuggestions" aria-label="Pertanyaan cepat">
          <span class="suggestions-label">Coba tanyakan:</span>

          <button class="chip" data-q="Obat apa yang hampir kedaluwarsa dalam 3 bulan?">
            <svg class="icon icon-sm" aria-hidden="true"><use href="#icon-clock"/></svg>
            Hampir kedaluwarsa
          </button>

          <button class="chip" data-q="Buat laporan harian">
            <svg class="icon icon-sm" aria-hidden="true"><use href="#icon-file-text"/></svg>
            Laporan harian
          </button>

          <button class="chip" data-q="Batch mana yang dijual dulu untuk Amoxicillin?">
            <svg class="icon icon-sm" aria-hidden="true"><use href="#icon-list-ordered"/></svg>
            Urutan FEFO
          </button>

          <button class="chip" data-q="Obat apa yang sudah kedaluwarsa?">
            <svg class="icon icon-sm" aria-hidden="true"><use href="#icon-x-circle"/></svg>
            Sudah kedaluwarsa
          </button>

          <button class="chip" data-q="Tampilkan semua obat berstatus Kritis">
            <svg class="icon icon-sm" aria-hidden="true"><use href="#icon-alert-octagon"/></svg>
            Status Kritis
          </button>

          <button class="chip" data-q="Berapa total nilai stok saya?">
            <svg class="icon icon-sm" aria-hidden="true"><use href="#icon-wallet"/></svg>
            Nilai stok
          </button>

          <button class="chip" data-q="Apa rekomendasi untuk batch Waspada?">
            <svg class="icon icon-sm" aria-hidden="true"><use href="#icon-lightbulb"/></svg>
            Rekomendasi
          </button>
        </div>

        <!-- Chat input area -->
        <div class="chat-input-area">
          <textarea
            id="chatInput"
            class="chat-input"
            rows="1"
            placeholder="Ketik pertanyaan Anda tentang stok obat..."
            aria-label="Pesan chat"
          ></textarea>
          <button id="sendBtn" class="send-btn" aria-label="Kirim pesan">
            <svg class="icon" aria-hidden="true"><use href="#icon-send"/></svg>
          </button>
        </div>
      </div>
    </section>

    <!-- ==================== PANEL: STOK ==================== -->
    <section id="panel-stock" class="panel" aria-label="Panel Stok">
      <div class="stock-header">
        <h2 class="section-title">
          <svg class="icon icon-md" aria-hidden="true"><use href="#icon-package"/></svg>
          Data Stok Obat
        </h2>
        <div class="stock-controls">
          <!-- Status filter — text options, no emoji needed in <select> -->
          <select id="stockFilter" class="stock-filter" aria-label="Filter status">
            <option value="all">Semua Status</option>
            <option value="Aman">Aman</option>
            <option value="Waspada">Waspada</option>
            <option value="Kritis">Kritis</option>
            <option value="Kedaluwarsa">Kedaluwarsa</option>
          </select>

          <!-- CSV import -->
          <label class="btn-secondary btn-icon-text" for="csvFile" title="Unggah file CSV">
            <svg class="icon icon-sm" aria-hidden="true"><use href="#icon-upload"/></svg>
            Unggah CSV
          </label>
          <input type="file" id="csvFile" accept=".csv" style="display:none" />

          <button class="btn-secondary btn-icon-text" id="pasteCsvBtn">
            <svg class="icon icon-sm" aria-hidden="true"><use href="#icon-clipboard"/></svg>
            Tempel CSV
          </button>

          <!-- Reset data: restores built-in dummy stock, removes any imported CSV -->
          <button class="btn-danger btn-icon-text" id="resetDataBtn" aria-label="Hapus data impor dan pulihkan data bawaan">
            <svg class="icon icon-sm" aria-hidden="true"><use href="#icon-rotate-ccw"/></svg>
            Reset data
          </button>
        </div>
      </div>

      <!-- CSV paste modal -->
      <div id="csvModal" class="modal-overlay" style="display:none" role="dialog" aria-modal="true" aria-labelledby="csvModalTitle">
        <div class="modal-box">
          <h3 id="csvModalTitle">
            <svg class="icon icon-sm" aria-hidden="true"><use href="#icon-clipboard"/></svg>
            Tempel Data CSV
          </h3>
          <p class="modal-hint">Format: <code>nama,batch,kadaluarsa(YYYY-MM-DD),qty,harga_beli,harga_jual</code></p>
          <textarea id="csvPasteArea" rows="10" placeholder="nama_obat,BATCH001,2025-08-01,100,5000,8000&#10;..." aria-label="Data CSV"></textarea>
          <div class="modal-actions">
            <button id="csvImportBtn" class="btn-primary">Impor Data</button>
            <button id="csvCancelBtn" class="btn-secondary">Batal</button>
          </div>
        </div>
      </div>

      <!-- Stock table container -->
      <div class="table-wrapper">
        <table class="stock-table" id="stockTable">
          <thead>
            <tr>
              <th>Nama Obat</th>
              <th>Batch</th>
              <th>Kedaluwarsa</th>
              <th>Sisa (pcs)</th>
              <th>Harga Beli</th>
              <th>Harga Jual</th>
              <th>Nilai Stok</th>
              <th>Status</th>
              <th>FEFO</th>
            </tr>
          </thead>
          <tbody id="stockTableBody">
            <!-- Rows injected by JS -->
          </tbody>
        </table>
      </div>
    </section>

    <!-- ==================== PANEL: LAPORAN ==================== -->
    <section id="panel-report" class="panel" aria-label="Panel Laporan">
      <div class="report-header">
        <h2 class="section-title">
          <svg class="icon icon-md" aria-hidden="true"><use href="#icon-file-text"/></svg>
          Laporan Harian Stok
        </h2>
        <button class="btn-primary btn-icon-text" id="refreshReportBtn">
          <svg class="icon icon-sm" aria-hidden="true"><use href="#icon-refresh-cw"/></svg>
          Perbarui Laporan
        </button>
      </div>
      <div id="reportContent">
        <!-- Report injected by JS -->
      </div>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
